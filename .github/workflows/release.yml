name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mc-1_21, mc-26_1, mc-26_2, mc-26_3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven (${{ matrix.profile }})
        run: mvn -B -P${{ matrix.profile }} clean package

      - name: Collect JAR
        run: |
          mkdir -p dist
          cp target/*.jar dist/

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.profile }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Solo publica cuando el disparador es un tag, no en ejecuciones manuales.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all JARs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.jar
          generate_release_notes: true
